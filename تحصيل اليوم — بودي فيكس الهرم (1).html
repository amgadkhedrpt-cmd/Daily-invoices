<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحصيل اليوم — بودي فيكس الهرم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pink:#e8117f; --pink-soft:#fde7f2; --blue:#1ba9e5; --blue-soft:#e3f5fc; --navy:#1f2a44;
  --bg:#f6f4f1; --card:#ffffff; --ink:#1f2a44; --muted:#6b7488; --line:#e6e2dc;
  --ok:#1b7f45; --ok-soft:#dcf3e5; --warn:#9a6b00; --warn-soft:#fff2cf; --bad:#c62828; --bad-soft:#fde3e3;
  --field:#fbfaf8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --card:#1b2231; --ink:#eef1f7; --muted:#9aa4b8; --line:#2b3446; --field:#151b28;
    --pink-soft:#3a1529; --blue-soft:#13303f; --ok-soft:#143326; --warn-soft:#3a2f10; --bad-soft:#3d1717;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --card:#1b2231; --ink:#eef1f7; --muted:#9aa4b8; --line:#2b3446; --field:#151b28;
  --pink-soft:#3a1529; --blue-soft:#13303f; --ok-soft:#143326; --warn-soft:#3a2f10; --bad-soft:#3d1717;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:inherit}
.field{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--pink);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--blue-soft);color:var(--ink)}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;margin-bottom:12px}
.pct{font-size:56px;font-weight:800;line-height:1}
.pct span{font-size:24px}
.hero .lbl{color:#c4cbe0;font-size:13px;font-weight:600}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:19px;font-weight:800}
.stat em{font-style:normal;color:#c4cbe0;font-size:12px;font-weight:600}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.chip b{color:var(--pink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:700;font-size:13.5px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.search{flex:1;min-width:160px}
.list{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start:5px solid var(--line)}
.row.done{border-inline-start-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)) padding-box}
.row.part{border-inline-start-color:#e2a400}
.row.cancel{opacity:.55;border-inline-start-color:var(--muted)}
.row.cancel .nm{text-decoration:line-through}
.r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:800;font-size:16px}
.nm small{color:var(--muted);font-weight:600;font-size:12.5px;margin-inline-start:6px}
.svc{color:var(--muted);font-size:13.5px}
.amt{text-align:left;white-space:nowrap}
.amt b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.amt small{display:block;color:var(--muted);font-size:11.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--blue-soft)}
.tag.p{background:var(--pink-soft);color:var(--pink)}
.tag.m{background:var(--warn-soft);color:var(--warn)}
.r2{display:grid;grid-template-columns:110px 110px 1fr auto;gap:8px;margin-top:10px;align-items:end}
.r2 label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.r2 .field{width:100%}
.r3{margin-top:8px}
.r3 .field{width:100%}
.stamp{margin-top:6px;font-size:12.5px;color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:var(--card);border-radius:14px;border:1px dashed var(--line)}
dialog{border:0;border-radius:16px;padding:0;max-width:440px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,20,32,.45)}
.dlg{padding:16px}
.dlg h3{margin:0 0 10px;font-size:18px}
.dlg .grid{display:grid;gap:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:12px}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols .chip button{border:0;background:none;color:var(--bad);font-weight:800;cursor:pointer;padding:0 2px}
.recon{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.recon h2{margin:0;font-size:17px;font-weight:800}
.recon .hint{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.rbox{border-radius:12px;padding:9px 11px;background:var(--field);border:1px solid var(--line)}
.rbox b{display:block;font-size:19px;font-weight:800}
.rbox em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700}
.rbox.bad{background:var(--bad-soft);border-color:transparent}.rbox.bad b{color:var(--bad)}
.rbox.ok{background:var(--ok-soft);border-color:transparent}.rbox.ok b{color:var(--ok)}
.rbox.warn{background:var(--warn-soft);border-color:transparent}.rbox.warn b{color:var(--warn)}
.issues{margin-top:10px;display:grid;gap:6px}
.iss{display:flex;justify-content:space-between;gap:8px;align-items:center;border-radius:10px;padding:8px 10px;font-size:13.5px;background:var(--field);border:1px solid var(--line)}
.iss.bad{border-inline-start:4px solid var(--bad)}.iss.warn{border-inline-start:4px solid #e2a400}
.iss .btn{min-height:32px;padding:4px 10px;font-size:12.5px}
.rc{margin-top:8px;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700}
.rc.ok{background:var(--ok-soft);color:var(--ok)}.rc.bad{background:var(--bad-soft);color:var(--bad)}.rc.warn{background:var(--warn-soft);color:var(--warn)}.rc.neu{background:var(--field);color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .pct{font-size:48px}
  .r2{grid-template-columns:1fr 1fr}
  .r2 .cbtn{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">BF</div>
      <div><h1>تحصيل اليوم</h1><small>بودي فيكس · فرع الهرم</small></div>
    </div>
    <div class="toolbar">
      <input type="date" id="day" class="field" aria-label="التاريخ">
      <label class="btn primary" for="file">⬆ رفع ملف المواعيد</label>
      <input type="file" id="file" accept=".xlsx,.xls" class="sr">
      <button class="btn blue" id="addBtn">＋ موعد يدوي</button>
      <button class="btn ghost" id="setBtn" title="الإعدادات">⚙</button>
    </div>
  </header>

  <div id="msg"></div>

  <section class="hero" aria-live="polite">
    <div>
      <div class="lbl">نسبة التحصيل النهارده</div>
      <div class="pct" id="pct">0<span>%</span></div>
      <div class="bar"><i id="barI"></i></div>
    </div>
    <div class="stats">
      <div class="stat"><em>المطلوب</em><b id="sReq">0</b></div>
      <div class="stat"><em>اتحصّل</em><b id="sCol">0</b></div>
      <div class="stat"><em>الباقي</em><b id="sLeft">0</b></div>
      <div class="stat"><em>مرضى (اتحصّل منهم)</em><b id="sCnt">0</b></div>
    </div>
  </section>
  <div class="who" id="who"></div>

  <section class="recon" id="recon">
    <div class="rhead">
      <div><h2>مراجعة آخر اليوم</h2>
      <div class="hint">صدّر مواعيد النهارده كلها <b>من غير</b> فلتر Remaining وارفعها هنا: الأداة تقارن المسجّل بالسيستم.</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <label class="btn blue" for="efile">⬆ رفع مواعيد آخر اليوم</label>
        <input type="file" id="efile" accept=".xlsx,.xls" class="sr">
        <button class="btn ghost" id="clrRecon" hidden>مسح المراجعة</button>
      </div>
    </div>
    <div id="rbody"></div>
  </section>

  <div class="filters">
    <button class="tab" data-f="all" aria-pressed="true">الكل</button>
    <button class="tab" data-f="open" aria-pressed="false">لسه</button>
    <button class="tab" data-f="done" aria-pressed="false">اتحصّل</button>
    <button class="tab" data-f="cancel" aria-pressed="false">ملغي</button>
    <button class="tab" data-f="issue" aria-pressed="false" id="issTab" hidden>فيه مشكلة</button>
    <input class="field search" id="q" placeholder="🔍 ابحث بالاسم أو الكود">
    <button class="btn ghost" id="expBtn">⬇ Excel</button>
  </div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<dialog id="addDlg"><form class="dlg" method="dialog" id="addForm">
  <h3>إضافة موعد يدوي</h3>
  <div class="grid">
    <input class="field" name="name" placeholder="اسم المريض" required>
    <input class="field" name="pid" placeholder="كود المريض (اختياري) مثل #8598">
    <input class="field" name="svc" placeholder="الخدمة" value="جلسة علاج طبيعي">
    <input class="field" name="due" type="number" min="0" step="1" inputmode="numeric" placeholder="المبلغ المطلوب تحصيله" required>
    <input class="field" name="note" placeholder="ملحوظة (اختياري)">
  </div>
  <div class="acts"><button class="btn primary" value="ok">إضافة</button><button class="btn ghost" value="cancel" formnovalidate>إلغاء</button></div>
</form></dialog>

<dialog id="setDlg"><div class="dlg">
  <h3>أسماء المسؤولين عن التحصيل</h3>
  <div class="cols" id="colList"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <input class="field" id="newCol" placeholder="اسم جديد" style="flex:1">
    <button class="btn blue" id="addCol">إضافة</button>
  </div>
  <div class="acts"><button class="btn ghost" id="closeSet">تم</button></div>
</div></dialog>

<script>
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(Number(n)||0)).toLocaleString('en-US');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const t12 = iso => { if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; let h=d.getHours(); const ap=h<12?'ص':'م'; h=h%12||12; return `${h}:${pad(d.getMinutes())} ${ap}`; };
const nowISO = () => new Date().toISOString();
const DEFAULT_COLS = ["Engy Mamdouh","Dalia","Nada Abdel Razik","Mariam Saad","Bassant","Georgina"];

/* ---------------- store: db (shared) with local fallback ---------------- */
let db = null, shared = false, unsubRows = null, unsubSet = null;
let rows = new Map(); let collectors = DEFAULT_COLS.slice(); let filter = 'all'; let recon = null; let unsubRecon = null;
const ATTENDED = ['Checked In','In Progress','Completed'];
const NOSHOW = /cancel|no ?show|missed|absent|ملغ|لم يحضر/i;
const TOL = 10;
const LS = {
  key: d => 'bf_coll_'+d,
  read(d){ try{ return JSON.parse(localStorage.getItem(this.key(d))||'{}'); }catch(e){ return {}; } },
  write(d,obj){ try{ localStorage.setItem(this.key(d), JSON.stringify(obj)); }catch(e){} },
  cols(){ try{ return JSON.parse(localStorage.getItem('bf_coll_cols')||'null'); }catch(e){ return null; } },
  setCols(c){ try{ localStorage.setItem('bf_coll_cols', JSON.stringify(c)); }catch(e){} }
};
const day = () => $('#day').value || todayStr();
const rowsCol = d => db.collection(`days/${d}/rows`);

async function saveRow(id, data){
  const cur = rows.get(id) || {};
  const next = {...cur, ...data, updatedAt: nowISO()};
  rows.set(id, next); render();
  if (shared){
    try { await rowsCol(day()).doc(id).set(stripId(next)); }
    catch(e){ showMsg(e && e.code==='invalid_argument' ? 'مش مسموح لك تعدّل — اطلب صلاحية Contributor من صاحب الصفحة.' : 'ما اتحفظش التعديل، جرّب تاني.', 'warn'); }
  } else {
    const all = LS.read(day()); all[id] = stripId(next); LS.write(day(), all);
  }
}
const stripId = o => { const c={...o}; delete c.id; return c; };
async function saveCollectors(list){
  collectors = list; renderCollectors(); render();
  if (shared){ try{ await db.doc('config/settings').set({collectors:list}); }catch(e){ showMsg('ما اتحفظتش الأسماء.','warn'); } }
  else LS.setCols(list);
}

async function saveRecon(obj){
  recon = obj; render();
  if (shared){ try{ if (obj) await db.doc(`days/${day()}/meta/recon`).set(obj); else await db.doc(`days/${day()}/meta/recon`).set({cleared:true}); }catch(e){ showMsg('ما اتحفظتش المراجعة.','warn'); } }
  else { const k='bf_recon_'+day(); try{ obj ? localStorage.setItem(k, JSON.stringify(obj)) : localStorage.removeItem(k); }catch(e){} }
}
function subscribeDay(){
  if (unsubRows){ unsubRows(); unsubRows=null; }
  if (unsubRecon){ unsubRecon(); unsubRecon=null; }
  rows = new Map(); recon = null;
  if (shared){
    unsubRecon = db.doc(`days/${day()}/meta/recon`).onSnapshot(s => { const d = s.exists ? s.data() : null; recon = (d && !d.cleared) ? d : null; render(); });
  } else { try{ recon = JSON.parse(localStorage.getItem('bf_recon_'+day())||'null'); }catch(e){ recon = null; } }
  if (shared){
    unsubRows = rowsCol(day()).onSnapshot(snap => {
      rows = new Map(snap.docs.filter(d=>d.exists).map(d => [d.id, {id:d.id, ...d.data()}]));
      render();
    }, err => { if (err && err.code==='revoked') showMsg('الصفحة بقت للعرض فقط.','warn'); });
  } else {
    const all = LS.read(day());
    Object.entries(all).forEach(([k,v]) => rows.set(k, {id:k, ...v}));
    render();
  }
}

/* ---------------- import appointments export ---------------- */
function rowId(pid){ return 'p' + String(pid||'').replace(/[^0-9A-Za-z]/g,''); }
function cell(r, ...keys){ for (const k of keys){ if (r[k]!==undefined && r[k]!==null && r[k]!=='') return r[k]; } return null; }
function parseWorkbook(buf){
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const ws = wb.Sheets['data'] || wb.Sheets[wb.SheetNames[0]];
  const data = XLSX.utils.sheet_to_json(ws, {defval:null});
  let fileDate = null, remFilter = false;
  const cfg = wb.Sheets['config'];
  if (cfg){ XLSX.utils.sheet_to_json(cfg,{header:1}).forEach(r => { if (r[0]==='Date' && r[1]) fileDate = String(r[1]); if (r[0]==='Remaining' && String(r[1]).toLowerCase()==='true') remFilter = true; }); }
  const pts = new Map(); let appts = 0, cancelled = 0;
  for (const r of data){
    if (typeof r['#'] !== 'number') continue;
    const pid = cell(r,'Patient ID'); const name = cell(r,'Patient');
    if (!pid || !name) continue;
    appts++;
    const st = String(cell(r,'Status')||'');
    const start = cell(r,'Start'); const iso = start instanceof Date ? start.toISOString() : (start? new Date(start).toISOString(): null);
    const id = rowId(pid);
    const p = pts.get(id) || {pid:String(pid), name:String(name).trim(), phone:cell(r,'Phone Number')||'', systemRem:Number(cell(r,'Remaining'))||0,
      firstPay: cell(r,'First Payment Date'), services:[], doctor:new Set(),
      lastDayPay: Number(cell(r,'Last Day Payments'))||0, lastPayDate: cell(r,'Last Payment Date')};
    p.services.push({type:String(cell(r,'Type')||'موعد'), time:iso, status:st});
    if (cell(r,'Doctor')) p.doctor.add(String(cell(r,'Doctor')));
    pts.set(id, p);
  }
  return {pts, appts, fileDate, remFilter};
}
function autoFlags(p){
  const f = [];
  if (p.services.length > 1) f.push(`${p.services.length} مواعيد — يتحاسب مرة واحدة`);
  if (p.systemRem > 0 && p.systemRem <= 20) f.push('فرق كسور');
  const fp = p.firstPay instanceof Date ? p.firstPay : (p.firstPay ? new Date(p.firstPay) : null);
  if (fp && !isNaN(fp) && (new Date(day()) - fp)/86400000 <= 10 && p.systemRem > 20) f.push('مريض جديد — غالبًا قسط باقة');
  return f;
}
async function importFile(file){
  try{
    const buf = await file.arrayBuffer();
    const {pts, appts, fileDate} = parseWorkbook(buf);
    if (!pts.size){ showMsg('الملف ما فيهوش مواعيد. اتأكد إنه تصدير Appointments بفلتر Remaining.', 'warn'); return; }
    let added=0, updated=0;
    for (const [id,p] of pts){
      const cur = rows.get(id);
      const services = p.services.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const base = {name:p.name, pid:p.pid, phone:p.phone, services, systemRem:p.systemRem, flags:autoFlags({...p,services}),
                    order: services[0] && services[0].time || '', manual:false};
      if (!cur){ await saveRow(id, {...base, due:p.systemRem, collected:0, collector:'', collectedAt:'', cancelled:false, note:'', createdAt:nowISO()}); added++; }
      else {
        const patch = {...base};
        if (!(Number(cur.collected)>0) && Number(cur.due)===Number(cur.systemRem)) patch.due = p.systemRem;
        await saveRow(id, patch); updated++;
      }
    }
    showMsg(`اترفع ${appts} موعد → ${pts.size} مريض (${added} جديد${updated?`، ${updated} اتحدّث`:''}).${fileDate?` تاريخ الملف: ${fileDate}`:''}`, 'info');
  }catch(e){ showMsg('مش قادر أقرا الملف. ارفع تصدير Appointments من Medicolize بصيغة xlsx.', 'warn'); }
}

function isoDay(v){ const d = v instanceof Date ? v : (v ? new Date(v) : null); if (!d || isNaN(d)) return ''; return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
async function importEvening(file){
  try{
    const {pts, appts, fileDate, remFilter} = parseWorkbook(await file.arrayBuffer());
    if (!pts.size){ showMsg('الملف ما فيهوش مواعيد.', 'warn'); return; }
    const out = {};
    for (const [id,p] of pts){
      const sts = [...new Set(p.services.map(x=>x.status))];
      out[id] = {pid:p.pid, name:p.name, rem:p.systemRem, statuses:sts, attended: p.services.some(x=>ATTENDED.includes(x.status)),
        noshow: p.services.every(x=>NOSHOW.test(x.status)), services:p.services.map(x=>({type:x.type,time:x.time})),
        paidToday: isoDay(p.lastPayDate)===day() ? p.lastDayPay : 0};
    }
    await saveRecon({at:nowISO(), file:fileDate||'', appts, pts:out, filtered: remFilter});
    showMsg(remFilter ? `اترفع ملف آخر اليوم بفلتر Remaining (${pts.size} مريض) — المراجعة هتبقى مختصرة. للمراجعة الكاملة صدّره من غير الفلتر.` : `اترفع ملف آخر اليوم: ${appts} موعد → ${pts.size} مريض — مراجعة كاملة.`, remFilter ? 'warn' : 'info');
  }catch(e){ showMsg('مش قادر أقرا ملف آخر اليوم.', 'warn'); }
}
function checkRow(r){
  if (!recon) return null;
  const ev = recon.pts[r.id];
  const col = Number(r.collected)||0;
  if (!ev && !recon.filtered){
    /* full review: every appointment of the day is in the file, so a missing patient is a real gap */
    if (r.manual) return {lvl:'bad', txt:'يدوي ومش موجود في مواعيد السيستم — اتأكد إنه اتسجّل', code:'manualMissing', delta:0};
    if (r.cancelled) return {lvl:'neu', txt:'ملغي ومش موجود في ملف آخر اليوم', code:'ok', delta:0};
    return {lvl:'warn', txt:'مش موجود في ملف آخر اليوم — الموعد اتمسح من السيستم؟', code:'missing', delta:0};
  }
  if (!ev){
    /* filtered file (Remaining = True): a missing patient = balance closed in the system */
    const due = Number(r.due)||0, sys = r.manual ? due : (Number(r.systemRem)||0);
    if (r.cancelled){
      if (sys > TOL) return {lvl:'warn', txt:`متعلّم ملغي بس حسابه اتقفل في السيستم (${fmt(sys)}) — حضر ودفع؟`, code:'cancelPaid', delta:sys};
      return {lvl:'neu', txt:'ملغي', code:'ok', delta:0};
    }
    if (Math.abs(sys - col) <= TOL) return {lvl:'ok', txt:`مش ظاهر آخر اليوم = حسابه اتقفل (${fmt(sys)}) = المسجّل ✓ (افتراض — الملف بفلتر)`, code:'ok', delta:sys};
    if (col > sys + TOL) return {lvl:'bad', txt:`مسجّل ${fmt(col)} والمتبقي في السيستم كان ${fmt(sys)} بس`, code:'money', delta:sys};
    return {lvl:'warn', txt:`مش ظاهر آخر اليوم (${fmt(sys)}) والمسجّل ${fmt(col)} — ${r.manual?'اتأكد إنه اتسجّل في السيستم':'اتحصّل ومتسجلش هنا؟'}`, code: r.manual ? 'manualMissing' : 'moneyMore', delta:sys};
  }
  const notes = []; let lvl = 'ok'; let code = 'ok';
  if (r.cancelled && ev.attended){ notes.push('متعلّم ملغي هنا بس حضر في السيستم'); lvl='bad'; code='cancelAttended'; }
  if (!r.cancelled && !ev.attended){
    if (ev.noshow){ notes.push('ما حضرش — المفروض يتعلّم «الموعد اتلغى»'); if (lvl!=='bad'){ lvl='warn'; code='noshow'; } }
    else { notes.push(`حالته في السيستم لسه: ${ev.statuses.join('، ')}`); if (lvl!=='bad'){ lvl='warn'; code='status'; } }
  }
  if (r.manual){
    const sys = ev.paidToday;
    if (Math.abs(sys - col) <= TOL) notes.push(`السيستم: اتدفع ${fmt(sys)} النهارده ✓`);
    else { notes.push(`مسجّل ${fmt(col)} · السيستم: اتدفع ${fmt(sys)} النهارده`); if (col > sys + TOL){ lvl='bad'; code='money'; } else if (lvl==='ok'){ lvl='warn'; code='moneyMore'; } }
  } else {
    const delta = (Number(r.systemRem)||0) - (Number(ev.rem)||0);
    if (ev.rem > r.systemRem + TOL) notes.push(`المطلوب في السيستم زاد ${fmt(ev.rem - r.systemRem)} (فواتير جديدة النهارده)`);
    if (col === 0 && Math.abs(delta) <= TOL){
      if (!r.cancelled && ev.attended && Number(ev.rem) > TOL){ notes.push(`حضر وما اتحصّلش منه — لسه عليه ${fmt(ev.rem)}`); if (lvl==='ok'){ lvl='neu'; code='uncollected'; } }
      else if (!notes.length) notes.push('ما اتحصّلش والسيستم ما اتغيّرش');
    }
    else if (Math.abs(delta - col) <= TOL){ notes.push(`المطلوب في السيستم قلّ ${fmt(Math.max(0,delta))} = المسجّل ✓`); }
    else if (col > delta + TOL){ notes.push(`مسجّل ${fmt(col)} لكن المطلوب في السيستم قلّ ${fmt(Math.max(0,delta))} بس`); lvl='bad'; code='money'; }
    else { notes.push(`المطلوب في السيستم قلّ ${fmt(delta)} والمسجّل ${fmt(col)} — اتحصّل ومتسجلش هنا؟`); if (lvl==='ok'){ lvl='warn'; code='moneyMore'; } }
  }
  return {lvl, txt: notes.join(' · '), code, delta: r.manual ? ev.paidToday : (Number(r.systemRem)||0)-(Number(ev.rem)||0)};
}
function forgotten(){
  if (!recon) return [];
  return Object.entries(recon.pts).filter(([id,ev]) => !rows.has(id) && ev.attended && Number(ev.rem) > TOL).map(([id,ev]) => ({id, ...ev}));
}
function addForgotten(id){
  const ev = recon && recon.pts[id]; if (!ev) return;
  saveRow(id, {name:ev.name, pid:ev.pid, phone:'', services:(ev.services||[]).map(x=>({...x,status:'added'})), systemRem:Number(ev.rem)||0, due:Number(ev.rem)||0,
    collected:0, collector:'', collectedAt:'', cancelled:false, note:'اتضاف من مراجعة آخر اليوم (كان ناقص)', flags:['اتنسى'], manual:false, order:(ev.services&&ev.services[0]&&ev.services[0].time)||'', createdAt:nowISO()});
}

/* ---------------- actions ---------------- */
function rowState(r){
  if (r.cancelled) return 'cancel';
  const c = Number(r.collected)||0, d = Number(r.due)||0;
  if (c > 0 && c >= d) return 'done';
  if (c > 0) return 'part';
  return 'open';
}
function onCollect(id, val, who){
  const r = rows.get(id); if (!r) return;
  const c = Math.max(0, Number(val)||0);
  if (c > 0 && !who){ showMsg('اختار اسم المسؤول عن التحصيل الأول.', 'warn'); render(); return; }
  saveRow(id, {collected:c, collector: c>0 ? who : '', collectedAt: c>0 ? (r.collectedAt && r.collected>0 ? r.collectedAt : nowISO()) : ''});
}
function toggleCancel(id){
  const r = rows.get(id); if (!r) return;
  if (!r.cancelled && Number(r.collected)>0){ if(!confirm('المريض ده اتحصّل منه فلوس. تلغي الموعد برضه؟')) return; }
  saveRow(id, {cancelled: !r.cancelled, cancelledAt: !r.cancelled ? nowISO() : ''});
}

/* ---------------- render ---------------- */
function totals(){
  let req=0, col=0, n=0, nc=0; const by = {};
  for (const r of rows.values()){
    if (r.cancelled) continue;
    n++; req += Number(r.due)||0;
    const c = Number(r.collected)||0; col += c;
    if (c>0){ nc++; const k=r.collector||'—'; by[k]=(by[k]||{n:0,v:0}); by[k].n++; by[k].v+=c; }
  }
  return {req, col, n, nc, by};
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  list = list.filter(r => {
    const st = rowState(r);
    if (filter==='open' && !(st==='open'||st==='part')) return false;

        <div><div class="nm">${esc(r.name)}<small>${esc(r.pid||'')}</small></div><div class="svc">${svc}</div>${tags?`<div class="tags">${tags}</div>`:''}</div>

    db = d; shared = true; subscribeDay();
    unsubSet = db.doc('config/settings').onSnapshot(s => {
      if (s.exists && Array.isArray(s.data().collectors) && s.data().collectors.length){ collectors = s.data().collectors.slice(); renderCollectors(); render(); }
    });
  } else showMsg('البيانات محفوظة على الجهاز ده بس (المزامنة مش متاحة في العرض ده).', 'warn');
})();
</script>
</body>
